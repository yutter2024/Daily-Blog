{{- /* 作品墙：海报点开 4K 原图，视频点开精彩片段（无触发元素时脚本自退） */}}
<script>
(function () {
  var triggers = document.querySelectorAll('[data-zoom],[data-video]');
  if (!triggers.length || document.querySelector('.zoom-layer')) return;

  var layer = document.createElement('div');
  layer.className = 'zoom-layer';
  layer.setAttribute('role', 'dialog');
  layer.setAttribute('aria-modal', 'true');
  layer.setAttribute('aria-label', '作品预览');
  layer.innerHTML = '<button class="zoom-close" type="button" aria-label="关闭">✕</button>' +
                    '<div class="zoom-stage"></div>' +
                    '<p class="zoom-cap"></p>' +
                    '<a class="zoom-src" href="#" target="_blank" rel="noopener">在新标签打开 ↗</a>';
  document.body.appendChild(layer);

  var stage = layer.querySelector('.zoom-stage');
  var cap = layer.querySelector('.zoom-cap');
  var srcLink = layer.querySelector('.zoom-src');
  var closeBtn = layer.querySelector('.zoom-close');
  var media = null;
  var lastFocus = null;

  function open(a) {
    var href = a.getAttribute('href');
    var title = a.getAttribute('data-title') || '';
    var isVideo = a.hasAttribute('data-video');

    if (isVideo) {
      stage.innerHTML = '<video controls autoplay playsinline preload="auto"></video>';
      media = stage.firstChild;
      media.src = href;
      srcLink.textContent = '在新标签打开 ↗';
    } else {
      stage.innerHTML = '<img>';
      media = stage.firstChild;
      media.alt = title;
      media.src = href;
      srcLink.textContent = '查看原图 ↗';
    }

    cap.textContent = title;
    srcLink.href = href;
    layer.classList.add('is-open');
    document.body.classList.add('zoom-lock');
    lastFocus = document.activeElement;
    closeBtn.focus();
  }

  function close() {
    if (media && media.tagName === 'VIDEO') {
      media.pause();
      media.removeAttribute('src');
      media.load();
    }
    stage.innerHTML = '';
    media = null;
    layer.classList.remove('is-open');
    document.body.classList.remove('zoom-lock');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  Array.prototype.forEach.call(triggers, function (a) {
    a.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();
      open(a);
    });
  });

  layer.addEventListener('click', function (e) {
    if (e.target === layer || e.target === closeBtn) close();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && layer.classList.contains('is-open')) close();
  });
})();
</script>
