{{- define "main" }}

<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Content }}<div class="page-content">{{ . }}</div>{{ end }}
</header>

<section class="works-grid">
  {{ range site.Data.works.items }}
  {{- $item := . }}
  <article class="work-card">
    <a class="work-thumb" href="{{ .link | relURL }}" aria-label="{{ .title }}">
      <img src="{{ .cover | relURL }}" alt="{{ .title }}" loading="lazy" decoding="async">
      {{- with .preview }}
      <video class="work-video" src="{{ . | relURL }}" poster="{{ $item.cover | relURL }}"
             muted loop playsinline preload="none" aria-hidden="true"></video>
      <span class="work-play" aria-hidden="true">▶</span>
      {{- end }}
    </a>
    <div class="work-body">
      <div class="work-meta">
        <span class="work-type">{{ .type }}</span>
        <span class="work-date">{{ .date }}</span>
      </div>
      <h2 class="work-title"><a href="{{ .link | relURL }}">{{ .title }}</a></h2>
      {{- with .note }}<p class="work-note">{{ . }}</p>{{ end }}
    </div>
  </article>
  {{ end }}
</section>

<script>
(() => {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.work-card').forEach((card) => {
    const video = card.querySelector('video.work-video');
    if (!video) return;
    const play = () => { video.play().catch(() => {}); };
    const stop = () => {
      video.pause();
      try { video.currentTime = 0; } catch (e) {}
    };
    card.addEventListener('pointerenter', play);
    card.addEventListener('pointerleave', stop);
    card.addEventListener('focusin', play);
    card.addEventListener('focusout', stop);
  });
})();
</script>

{{- end }}
