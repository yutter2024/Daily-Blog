baseURL: "https://yutterx.com/"
title: "Yutter的日常"
description: "记录日常、AI、教程与折腾的个人博客"
keywords:
  - 个人博客
  - 日常
  - AI
  - 教程
  - 折腾
author: "Yutter"
languageCode: "zh-cn"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
theme: "PaperMod"

params:
  env: production
  description: "记录日常、AI、教程与折腾的个人博客"
  author: "Yutter"
  DateFormat: "2006-01-02"
  defaultTheme: auto
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowWordCount: false
  ShowRssButtonInSectionMenu: true
  ShowPageNums: true
  disableSpecial1stPost: true
  mainSections:
    - posts
  assets:
    favicon: "/favicon.ico"
  homeInfoParams:
    Title: "你好，我是Yutter 👋"
    Content: |
      这里是我的个人博客。

      记录日常、AI、教程与折腾，什么都写一点。
  profileMode:
    enabled: true
    title: "你好，我是 Yutter 👋"
    subtitle: |
      记录日常，顺带折腾。

      把日常、想法和折腾过的东西写下来，
      偶尔也整理成能照着做的教程。
    imageUrl: "avatar.png"
    imageTitle: "Yutter"
    imageWidth: 128
    imageHeight: 128
    buttons:
      - name: 从这里开始
        url: /start/
      - name: 翻翻文章
        url: /posts/
  socialIcons:
    - name: github
      url: "https://github.com/yutter2024"
    - name: email
      url: "mailto:yutter@yutterx.com"
  label:
    text: "Yutter的日常"
    icon: "/favicon.svg"
    iconHeight: 28

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 5
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 15
    - identifier: start
      name: 从这里开始
      url: /start/
      weight: 25
    - identifier: about
      name: 关于
      url: /about/
      weight: 40
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
    tabWidth: 4

permalinks:
  posts: /posts/:slug/

privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true

enableRobotsTXT: true
